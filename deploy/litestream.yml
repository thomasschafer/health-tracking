# Litestream config for replicating the health database to Cloudflare R2. Everything
# machine-specific or secret comes from the environment file (see docs/operations.md), so
# LITESTREAM_CONFIG can point straight at this file.

# Keep 30 days of history (the default is 24 hours), so data damaged by a bug can be restored
# from before the damage. A daily snapshot of this small database costs next to nothing.
snapshot:
  interval: 24h
  retention: 720h

dbs:
  - path: ${HEALTH_DATA_DIR}/health.db
    replica:
      type: s3
      bucket: health-tracking-backups
      path: health.db
      # https://<CLOUDFLARE_ACCOUNT_ID>.r2.cloudflarestorage.com
      endpoint: ${LITESTREAM_ENDPOINT}
      region: auto
      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
      # Objects are encrypted with this key on the way in (SSE-C), and Cloudflare doesn't keep
      # it. Without the key the backups can't be read, so it must also be kept somewhere safe
      # off the laptop, such as a password manager.
      sse-customer-algorithm: AES256
      sse-customer-key: ${LITESTREAM_SSE_CUSTOMER_KEY}
